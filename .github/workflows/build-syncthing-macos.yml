name: Build Syncthing macOS v2

on:
  pull_request:
    branches:
      - v2
  push:

# A note on actions and third party code... The actions under actions/ (like
# `uses: actions/checkout`) are maintained by GitHub, and we need to trust
# GitHub to maintain their code and infrastructure or we're in deep shit in
# general. The same doesn't necessarily apply to other actions authors, so
# some care needs to be taken when adding steps, especially in the paths
# that lead up to code being packaged and signed.

jobs:
  build-debug:
    name: Build debug
    if: github.event_name == 'pull_request' && github.ref != 'refs/heads/v2' # Debug not necessary on release branch (develop is intermediate branch)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build debug target
        run: make debug

      - name: Prepare debug build for artifact
        run: make debug-dist 

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: syncthing-macos-debug
          path: Build/Products/Debug/dist

  build-release:
    name: Build release
    if: github.event_name == 'push' && github.ref == 'refs/heads/v2'
    environment: signing
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'true'

      - name: Import signing certificate
        run: |
          # Set up a run-specific keychain, making it available for the
          # `codesign` tool.
          umask 066
          KEYCHAIN_PATH=$RUNNER_TEMP/codesign.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"

          # Import the certificate
          CERTIFICATE_PATH=$RUNNER_TEMP/codesign.p12
          echo "$DEVELOPER_ID_CERTIFICATE_BASE64" | base64 -d -o "$CERTIFICATE_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$DEVELOPER_ID_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions "$KEYCHAIN_PATH"

          # Set the codesign identity for following steps
          echo "CODESIGN_IDENTITY=$CODESIGN_IDENTITY" >> $GITHUB_ENV
        env:
          DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}

      - name: Build release dmg
        run: |
          make release-dmg

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: syncthing-macos-v2-dmg-release
          path: Build/Products/Release/*.dmg

  notarize:
    name: Notarize for macOS
    if: github.event_name == 'push' && github.ref == 'refs/heads/v2'
    environment: signing
    needs:
      - build-release
    runs-on: macos-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: syncthing-macos-v2-dmg-release

      - name: Notarize and staple binaries
        run: |
          set -euo pipefail
          APPSTORECONNECT_API_KEY_PATH="$RUNNER_TEMP/apikey.p8"
          echo "$APPSTORECONNECT_API_KEY" | base64 -d -o "$APPSTORECONNECT_API_KEY_PATH"
          for file in Syncthing-*.dmg ; do
            echo "-- Submitting $file for notarization"
            result="$(xcrun notarytool submit "$file" \
              -k "$APPSTORECONNECT_API_KEY_PATH" \
              -d "$APPSTORECONNECT_API_KEY_ID" \
              -i "$APPSTORECONNECT_API_KEY_ISSUER" \
              --wait --timeout 30m --output-format json)"
            echo "$result"
            status="$(echo "$result" | python3 -c 'import sys,json; print(json.load(sys.stdin)["status"])')"
            if [ "$status" != "Accepted" ]; then
              echo "::error::Notarization of $file failed with status: $status"
              exit 1
            fi
            echo "-- Stapling notarization ticket into $file"
            xcrun stapler staple "$file"
          done
        env:
          APPSTORECONNECT_API_KEY: ${{ secrets.APPSTORECONNECT_API_KEY }}
          APPSTORECONNECT_API_KEY_ID: ${{ secrets.APPSTORECONNECT_API_KEY_ID }}
          APPSTORECONNECT_API_KEY_ISSUER: ${{ secrets.APPSTORECONNECT_API_KEY_ISSUER }}

      - name: Upload notarized DMG
        uses: actions/upload-artifact@v4
        with:
          name: syncthing-macos-v2-dmg-notarized
          path: Syncthing-*.dmg

  publish-release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/v2'
    needs:
      - notarize
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - name: Download notarized DMG
        uses: actions/download-artifact@v4
        with:
          name: syncthing-macos-v2-dmg-notarized

      - name: Create release when the bundled version is new
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          dmg="$(ls Syncthing-*.dmg | head -1)"
          if [ -z "$dmg" ]; then
            echo "::error::No notarized DMG found to publish"
            exit 1
          fi
          # create-dmg.sh names the file Syncthing-<CFBundleShortVersionString>.dmg,
          # e.g. Syncthing-2.1.2-1.dmg -> app version 2.1.2-1, tag v2.1.2-1.
          appver="$(basename "$dmg" .dmg | sed -E 's/^Syncthing-//')"
          tag="v${appver}"
          stver="${appver%-*}"   # upstream Syncthing version, e.g. 2.1.2
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing new to publish."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # ------------------------------------------------------------------
          # Release notes
          #
          # The GitHub release body is what users actually read:
          # cmd/ghreleases2appcast renders it into the appcast <description>,
          # which is exactly what the Sparkle update dialog shows. So inline the
          # Syncthing changelog here rather than only linking to it.
          # ------------------------------------------------------------------

          # True when version $1 is not newer than version $2.
          ver_le() { [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | head -1)" = "$1" ]; }

          # Syncthing version bundled by the latest release of this repository,
          # empty when there is no previous release.
          previously_bundled_version() {
            local tag
            tag="$(gh release list --repo "$GH_REPO" --limit 1 \
              --json tagName --jq '.[0].tagName // ""' 2>/dev/null || true)"
            tag="${tag#v}"
            printf '%s' "${tag%-*}"
          }

          # Stable upstream versions newer than $1, up to and including $2,
          # newest first. A bundle does not always advance by one version
          # (v2.1.2-1 -> v2.1.5-1 skipped upstream v2.1.3), and the notes of a
          # skipped release would otherwise never reach users.
          upstream_versions_since() {
            local prev="$1" cur="$2" v picked=""
            for v in $(gh api --paginate repos/syncthing/syncthing/releases \
              --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' \
              2>/dev/null | sed 's/^v//' || true); do
              ver_le "$v" "$cur" || continue
              if [ -n "$prev" ] && ver_le "$v" "$prev"; then
                continue
              fi
              picked="$picked $v"
            done
            printf '%s\n' $picked | sort -rV
          }

          # Release notes of upstream Syncthing $1, empty when unavailable.
          upstream_release_body() {
            gh release view "v$1" --repo syncthing/syncthing \
              --json body --jq '.body // ""' 2>/dev/null || true
          }

          # Append a changelog link and the release notes of every version in $@
          # to $links_file and $notes_file, then echo the versions that fit.
          # GitHub caps a release body at 125 kB, so stop well short of that.
          collect_changelogs() {
            local v body per_version_headings=no included=""
            if [ $# -gt 1 ]; then
              per_version_headings=yes
            fi
            for v in "$@"; do
              body="$(upstream_release_body "$v")"
              [ -n "$body" ] || continue
              if [ $(( $(wc -c < "$notes_file") + ${#body} )) -gt 100000 ]; then
                printf '\n---\n\nOlder release notes: %s\n' \
                  "https://github.com/syncthing/syncthing/releases" >> "$notes_file"
                break
              fi
              {
                printf '\n---\n\n'
                # h1: upstream bodies use h2 as their top level.
                if [ "$per_version_headings" = yes ]; then
                  printf '# Syncthing v%s\n\n' "$v"
                fi
                printf '%s\n' "$body"
              } >> "$notes_file"
              printf -- '- [Syncthing v%s changelog](https://github.com/syncthing/syncthing/releases/tag/v%s)\n' \
                "$v" "$v" >> "$links_file"
              included="$included $v"
            done
            printf '%s\n' $included
          }

          links_file=changelog-links.md
          notes_file=upstream-notes.md
          : > "$links_file"
          : > "$notes_file"

          # Version lists are whitespace separated, hence the unquoted expansions.
          versions="$(upstream_versions_since "$(previously_bundled_version)" "$stver")"
          [ -n "$versions" ] || versions="$stver"
          included="$(collect_changelogs $versions)"
          newest="$(printf '%s\n' $included | head -1)"
          oldest="$(printf '%s\n' $included | tail -1)"

          # The DMG is already built, signed and notarized at this point, so an
          # unreachable GitHub API must not fail the job: publish with a plain
          # link to the release notes instead.
          if [ ! -s "$notes_file" ]; then
            echo "::warning::Could not read upstream release notes for v${stver}; publishing with the link only."
          fi

          {
            echo "Bundles Syncthing v${stver}."
            echo
            if [ -s "$notes_file" ]; then
              if [ "$newest" = "$oldest" ]; then
                echo "Here is what's new in it:"
              else
                echo "Here is what's new in v${oldest}–v${newest}:"
              fi
              echo
              cat "$links_file" "$notes_file"
            else
              echo "Release notes: https://github.com/syncthing/syncthing/releases/tag/v${stver}"
            fi
          } > release-notes.md
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes-file release-notes.md \
            "$dmg"
          echo "published=true" >> "$GITHUB_OUTPUT"

  regenerate-appcast:
    name: Regenerate appcast
    if: needs.publish-release.result == 'success' && needs.publish-release.outputs.published == 'true'
    needs:
      - publish-release
    runs-on: ubuntu-latest
    steps:
      - name: Trigger appcast generation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # workflow_dispatch triggered via GITHUB_TOKEN is exempt from GitHub's
        # anti-recursion rule, so no PAT is needed here.
        run: gh workflow run generate-appcast.yml --ref v2
